# AI Marketing Employee —— <your-domain> 反向代理
# 放到 /etc/nginx/sites-available/<your-domain>，软链到 sites-enabled 后 reload
# 说明：/api/run 是 SSE 流式推送，必须关闭 proxy_buffering，否则执行流不会实时推进。

server {
    listen 80;
    listen [::]:80;
    server_name <your-domain>;

    client_max_body_size 10m;

    # 静态资源长缓存（前端带 hash 的字体等）
    location ~* \.(woff2|woff|ttf)$ {
        proxy_pass http://127.0.0.1:8890;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必需：关闭缓冲与缓存
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
