<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>营销海报 · AdAgent</title>
<link rel="stylesheet" href="poster.css">
</head>
<body>
<div class="poster" id="poster" hidden>
  <div class="visual">
    <div class="motif" id="motif"></div>
    <div class="visual-scrim"></div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="body">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 class="headline" id="headline"></h1>
    <p class="subline" id="subline"></p>

    <ol class="points" id="points"></ol>

    <div class="kw" id="kw" hidden></div>

    <div class="foot">
      <div class="shop">
        <p class="shop-name" id="shop-name"></p>
        <p class="shop-meta" id="shop-meta"></p>
      </div>
      <p class="cta" id="cta"></p>
      <p class="fine" id="fine"></p>
    </div>
  </div>
</div>
<div class="fallback" id="fallback" hidden>缺少海报规格（spec）</div>
<script src="poster.js"></script>
</body>
</html>
